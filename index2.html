<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StewartLynch YouTube</title>
  <style>
    /* --- Reset / Base --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#1e1e1e; color:#fff; height:100vh; overflow:hidden; }

    .app-container { display:flex; height:100vh; }
    .sidebar { width:450px; background:#2a2a2a; border-right:1px solid #404040; display:flex; flex-direction:column; }
    .header { padding:20px; border-bottom:1px solid #404040; }
    .app-title { font-size:18px; font-weight:600; margin-bottom:15px; }
    .filters { display:flex; gap:10px; margin-bottom:15px; }
    .filter-input, .tag-selector {
      flex:1; padding:8px 12px; background:#404040; border:none; border-radius:6px; color:#fff; font-size:14px; min-width:0;
    }
    .tag-selector { min-width:120px; flex:0 0 auto; }
    .filter-input::placeholder { color:#999; }
    .video-count { font-size:14px; color:#999; }

    .video-list { flex:1; overflow-y:auto; padding:10px; }
    .video-item { display:flex; padding:12px; margin-bottom:8px; background:#333; border-radius:8px; cursor:pointer; transition:background .2s; }
    .video-item:hover { background:#404040; }
    .video-item.selected { background:#0066cc; }

    .video-thumbnail { width:120px; height:68px; border-radius:6px; object-fit:cover; margin-right:12px; }
    .video-info { flex:1; min-width:0; }
    .video-title { font-size:14px; font-weight:500; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .video-meta { font-size:12px; color:#999; margin-bottom:4px; }
    .video-duration { font-size:11px; color:#ccc; background:rgba(0,0,0,.7); padding:2px 6px; border-radius:3px; display:inline-block; }
    .video-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
    .tag { font-size:10px; padding:2px 6px; border-radius:3px; color:white; }

    .main-content { flex:1; padding:20px; overflow-y:auto; background:#1e1e1e; }
    .detail-view { max-width:800px; }
    .detail-header { margin-bottom:20px; }
    .detail-title { font-size:24px; font-weight:600; margin-bottom:10px; }
    .detail-meta { display:flex; gap:20px; font-size:14px; color:#999; margin-bottom:15px; flex-wrap:wrap; }
    .detail-thumbnail { width:100%; max-width:640px; height:auto; border-radius:8px; margin-bottom:20px; }
    .detail-description { line-height:1.6; margin-bottom:20px; white-space:pre-wrap; }
    .detail-links { display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap; }
    .link-button { padding:10px 20px; background:#0066cc; color:white; text-decoration:none; border-radius:6px; font-size:14px; font-weight:500; transition:background .2s; }
    .link-button:hover { background:#0052a3; }
    .starter-link { background:#28a745; } .starter-link:hover { background:#1e7e34; }
    .source-link { background:#6f42c1; } .source-link:hover { background:#5a32a3; }

    .video-player { margin:20px 0; border-radius:8px; overflow:hidden; background:#000; }
    .video-player iframe { width:100%; height:400px; border:none; }

    .placeholder { text-align:center; color:#666; font-size:18px; margin-top:100px; }
    .loading { text-align:center; padding:40px; color:#666; }

    /* Status badges */
    .status-released { background:#28a745; }
    .status-kofiready { background:#ff6b35; }
    .status-planning { background:#6c757d; }

    /* Play overlay affordance */
    .thumbnail-wrapper { position:relative; display:inline-block; cursor:pointer; border-radius:8px; overflow:hidden; }
    .play-overlay { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.25); opacity:0; transition:opacity .2s; pointer-events:none; }
    .thumbnail-wrapper:hover .play-overlay, .thumbnail-wrapper:focus-within .play-overlay { opacity:1; }
    .play-badge { width:72px; height:72px; border-radius:50%; background:rgba(0,0,0,.55); display:grid; place-items:center; box-shadow:0 4px 16px rgba(0,0,0,.35); }
    .play-badge svg { width:28px; height:28px; fill:#fff; margin-left:3px; }

    /* --- Mobile layout (large thumbnails stacked) --- */
    .mobile-header { display:none; }
    @media (max-width: 768px) {
      .app-container { flex-direction:column; }
      .sidebar { width:100%; height:100vh; position:fixed; z-index:100; transform:translateX(-100%); transition:transform .3s; }
      .sidebar.show-mobile { transform:translateX(0); }
      .main-content { width:100%; padding:10px; }
      .mobile-header { display:block; padding:15px; background:#2a2a2a; border-bottom:1px solid #404040; position:sticky; top:0; z-index:50; }
      .mobile-toggle { background:#0066cc; color:white; border:none; padding:10px 15px; border-radius:6px; font-size:14px; cursor:pointer; }

      /* Big stacked thumbnails with text below */
      .video-item { flex-direction:column; align-items:stretch; }
      .video-thumbnail {
        width:100%; height:auto; aspect-ratio:16 / 9;
        object-fit:contain; /* avoid top/bottom clipping */
        background:#000;    /* letterbox bars */
        margin:0 0 10px 0;
      }
    }
  </style>

<!-- Home Screen & PWA icons -->
<link rel="apple-touch-icon" sizes="180x180" href="webapp-icons/apple-touch-icon-180x180.png">
<link rel="apple-touch-icon" sizes="167x167" href="webapp-icons/apple-touch-icon-167x167.png">
<link rel="apple-touch-icon" sizes="152x152" href="webapp-icons/apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="120x120" href="webapp-icons/apple-touch-icon-120x120.png">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="webapp-icons/favicon.ico">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StewartLynch">
<meta name="theme-color" content="#1e1e1e">


  <style>
    /* Force search bar and tag selector onto separate rows */
    .filters {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filters .filter-input,
    .filters .tag-selector {
      flex: none;
      width: 100%;
    }
  </style>

</head>
<body>
  <div class="app-container">
    <div class="mobile-header">
      <button class="mobile-toggle" onclick="toggleMobile()">Show Videos (<span id="mobile-count">0</span>)</button>
    </div>

    <div class="sidebar" id="sidebar">
      <div class="header">
        <div class="app-title">StewartLynch YouTube</div>
        <div class="filters">
          <input type="text" class="filter-input" placeholder="Search name or description..." id="searchInput" />
          <select class="tag-selector" id="tagSelector">
            <option value="">All Tags</option>
          </select>
        </div>
        <div class="video-count">Count: <span id="videoCount">0</span></div>
      </div>
      <div class="video-list" id="videoList">
        <div class="loading">Loading videos...</div>
      </div>
    </div>

    <main class="main-content" id="mainContent">
      <div class="placeholder">Select a video to view details</div>
    </main>
  </div>

  <script>
    // --- State ---
    let videos = [];
    let filteredVideos = [];
    let playlists = [];
    let selectedVideoId = null;

    const isMobile = () => window.innerWidth <= 768;

    // --- Init ---
    document.addEventListener('DOMContentLoaded', () => {
      bindUI();
      // On phones: show list by default, hide detail until selection
      if (isMobile()) {
        document.getElementById('sidebar').classList.add('show-mobile');
        document.getElementById('mainContent').style.display = 'none';
      }
      loadData();
    });

    function bindUI() {
      document.getElementById('searchInput').addEventListener('input', onFilterChange);
      document.getElementById('tagSelector').addEventListener('change', onFilterChange);
      window.addEventListener('resize', () => {
        if (isMobile()) {
          if (selectedVideoId) {
            // If something is selected, keep detail visible and list hidden
            document.getElementById('sidebar').classList.remove('show-mobile');
            document.getElementById('mainContent').style.display = 'block';
          } else {
            // No selection: list-first
            document.getElementById('sidebar').classList.add('show-mobile');
            document.getElementById('mainContent').style.display = 'none';
          }
        } else {
          // Desktop: both panes visible
          document.getElementById('sidebar').classList.remove('show-mobile');
          document.getElementById('mainContent').style.display = 'block';
        }
        updateMobileButton();
      });
    }

    function toggleMobile() {
      if (!isMobile()) return;
      const sb = document.getElementById('sidebar');
      const willShow = !sb.classList.contains('show-mobile');
      if (willShow) {
        sb.classList.add('show-mobile');
        if (!selectedVideoId) document.getElementById('mainContent').style.display = 'none';
      } else {
        sb.classList.remove('show-mobile');
        if (!selectedVideoId) document.getElementById('mainContent').style.display = 'block';
      }
      updateMobileButton();
    }

    function updateMobileButton() {
      const btn = document.querySelector('.mobile-toggle');
      if (!btn) return;
      const shown = document.getElementById('sidebar').classList.contains('show-mobile');
      btn.innerHTML = `${shown ? 'Hide' : 'Show'} Videos (<span id="mobile-count">${filteredVideos.length}</span>)`;
    }

    // --- Data Load ---
    async function loadData() {
      const list = document.getElementById('videoList');
      try {
        const jsonURL = new URL('WebApp.json', window.location.href);
        jsonURL.searchParams.set('_', Date.now()); // cache-bust
        const response = await fetch(jsonURL.toString(), { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        const data = await response.json();

        // Accept multiple shapes for safety
        videos =
          (Array.isArray(data.eVideos) && data.eVideos) ||
          (Array.isArray(data.videos) && data.videos) ||
          (Array.isArray(data.items) && data.items) ||
          (Array.isArray(data) && data) || [];
        playlists =
          (Array.isArray(data.eplaylists) && data.eplaylists) ||
          (Array.isArray(data.playlists) && data.playlists) || [];

        // Normalize records
        videos = videos.map(v => ({
          id: v.id || v.videoId || v.youtubeId || '',
          video: v.video || v.title || '',
          videoDescription: v.videoDescription || v.description || '',
          starterProject: v.starterProject || v.starter || '',
          sourceCode: v.sourceCode || v.source || v.repo || '',
          playlists: v.playlists || (Array.isArray(v.tags) ? v.tags.join(',') : ''),
          releaseDate: (typeof v.releaseDate !== 'undefined' ? v.releaseDate : v.publishedAt || v.date || null),
          status: v.status || 'released',
          length: v.length || v.duration || ''
        })).filter(v => v.id && v.video);

        setupPlaylists();
        filteredVideos = [...videos];
        renderVideos();
        updateCount();
      } catch (err) {
        console.error('Failed to load WebApp.json', err);
        list.innerHTML = `
          <div class="loading">
            <p>Error loading videos from <code>WebApp.json</code>.</p>
            <p><strong>Details:</strong> ${String(err.message || err)}</p>
            <p>Ensure <code>webapp.html</code> and <code>WebApp.json</code> are in the same folder and served via a local web server.</p>
          </div>`;
      }
    }

    function setupPlaylists() {
      const tagSelector = document.getElementById('tagSelector');
      tagSelector.innerHTML = '<option value="">All Tags</option>';
      playlists.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name || p;
        opt.textContent = p.name || p;
        tagSelector.appendChild(opt);
      });
    }

    function normalizeHex(color) { if (!color) return '#666'; const c = String(color).trim(); return c.startsWith('#') ? c : `#${c}`; }
    function getPlaylistColor(playlistName) { const p = playlists.find(x => (x.name || x) === playlistName); return p ? normalizeHex(p.color || '#666') : '#666'; }

    // Apple CFAbsoluteTime (seconds since 2001-01-01) or ISO → localized date
    function formatDate(dateValue) {
      if (!dateValue && dateValue !== 0) return '—';
      if (typeof dateValue === 'number') {
        const base2001 = new Date('2001-01-01T00:00:00Z').getTime();
        return new Date(base2001 + dateValue * 1000).toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
      }
      const d = new Date(dateValue);
      return isNaN(d.getTime()) ? '—' : d.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    }

    function getStatusClass(status) {
      switch (status) { case 'released': return 'status-released'; case 'kofiready': return 'status-kofiready'; case 'planning': return 'status-planning'; default: return 'status-released'; }
    }
    function getStatusText(status) {
      switch (status) { case 'released': return 'Released'; case 'kofiready': return 'Available to Ko-fi Subscribers'; case 'planning': return 'In Planning'; default: return 'Released'; }
    }

    function thumbURL(id){ return `https://img.youtube.com/vi/${id}/mqdefault.jpg`; }
    function heroURL(id){ return `https://img.youtube.com/vi/${id}/maxresdefault.jpg`; }

    function updateCount(){
      const c = filteredVideos.length;
      document.getElementById('videoCount').textContent = c;
      const m = document.getElementById('mobile-count');
      if (m) m.textContent = c;
      updateMobileButton();
    }

    function renderVideos() {
      const container = document.getElementById('videoList');
      if (!filteredVideos.length) { container.innerHTML = '<div class="loading">No videos found</div>'; return; }
      container.innerHTML = filteredVideos.map(v => {
        const tags = (v.playlists || '').split(',').map(s => s.trim()).filter(Boolean);
        return `<div class="video-item ${selectedVideoId === v.id ? 'selected' : ''}" onclick="selectVideo('${v.id}')">
          <img src="${thumbURL(v.id)}" alt="${escapeHtml(v.video)}" class="video-thumbnail" loading="lazy">
          <div class="video-info">
            <div class="video-title">${escapeHtml(v.video)}</div>
            <div class="video-meta">Release Date: ${formatDate(v.releaseDate)}</div>
            <div class="video-duration">${v.length || 'N/A'}</div>
            <div class="video-tags">${tags.map(t => `<span class="tag" style="background-color:${getPlaylistColor(t)}">${escapeHtml(t)}</span>`).join('')}</div>
          </div>
        </div>`;
      }).join('');
    }

    function selectVideo(videoId) {
      selectedVideoId = videoId;
      const v = videos.find(x => x.id === videoId);
      if (!v) return;
      renderVideos();

      const main = document.getElementById('mainContent');
      const tags = (v.playlists || '').split(',').map(s => s.trim()).filter(Boolean);

      // On phone: show detail, hide list
      if (isMobile()) {
        document.getElementById('sidebar').classList.remove('show-mobile');
        main.style.display = 'block';
      }

      main.innerHTML = `<div class="detail-view">
        <div class="detail-header">
          <h1 class="detail-title">${escapeHtml(v.video)}</h1>
          <div class="detail-meta">
            <span>Video Length: ${v.length || 'N/A'}</span>
            <span>Status: <span class="tag ${getStatusClass(v.status)}">${getStatusText(v.status)}</span></span>
          </div>
          <div class="detail-meta">
            <span>Release Date: ${formatDate(v.releaseDate)}</span>
          </div>
        </div>

        <div id="heroSlot">
          <div class="thumbnail-wrapper" onclick="playVideo('${v.id}')" title="Play video" role="button" tabindex="0"
               onkeypress="if(event.key==='Enter'||event.key===' '){playVideo('${v.id}');}">
            <img src="${heroURL(v.id)}" alt="${escapeHtml(v.video)}" class="detail-thumbnail" />
            <div class="play-overlay" aria-hidden="true">
              <div class="play-badge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
              </div>
            </div>
          </div>
        </div>

        <div class="detail-description">${(v.videoDescription || '').replace(/\n/g,'<br>')}</div>

        <div class="detail-links">
          ${v.id ? `<a href="https://youtu.be/${v.id}" target="_blank" rel="noopener" class="link-button">Video Link</a>` : ''}
          ${v.starterProject ? `<a href="${v.starterProject.trim()}" target="_blank" rel="noopener" class="link-button starter-link">Starter Project</a>` : ''}
          ${v.sourceCode ? `<a href="${v.sourceCode.trim()}" target="_blank" rel="noopener" class="link-button source-link">Completed Source Code</a>` : ''}
        </div>

        <div class="video-tags">
          ${tags.map(t => `<span class="tag" style="background-color:${getPlaylistColor(t)}">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>`;
    }

    function playVideo(id) {
      const hero = document.getElementById('heroSlot'); if (!hero) return;
      if (hero.dataset.mode === 'player') return;
      hero.innerHTML = `<div class="video-player">
        <iframe src="https://www.youtube.com/embed/${id}?autoplay=1"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>`;
      hero.dataset.mode = 'player';
      hero.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function onFilterChange() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const tag = document.getElementById('tagSelector').value;

      filteredVideos = videos.filter(v => {
        const matchesText =
          !q ||
          (v.video && v.video.toLowerCase().includes(q)) ||
          (v.videoDescription && v.videoDescription.toLowerCase().includes(q)) ||
          (v.playlists && v.playlists.toLowerCase().includes(q));

        const matchesTag =
          !tag ||
          (v.playlists || '')
            .split(',')
            .map(s => s.trim())
            .some(p => p === tag);

        return matchesText && matchesTag;
      });

      renderVideos();
      updateCount();
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
